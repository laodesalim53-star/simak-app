<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E5FE0"/>
      <stop offset="100%" stop-color="#2F6FE0"/>
    </linearGradient>
    <linearGradient id="skyBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EAF3FF"/>
      <stop offset="100%" stop-color="#CFE3FB"/>
    </linearGradient>
    <linearGradient id="rambut4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A2A1E"/>
      <stop offset="100%" stop-color="#241811"/>
    </linearGradient>
    <linearGradient id="seragam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A87C4F"/>
      <stop offset="100%" stop-color="#8A6238"/>
    </linearGradient>
  </defs>

  <!-- Outer ring -->
  <circle cx="250" cy="250" r="248" fill="url(#ring)"/>
  <!-- Inner sky background -->
  <circle cx="250" cy="250" r="228" fill="url(#skyBg)"/>

  <clipPath id="innerClip2">
    <circle cx="250" cy="250" r="228"/>
  </clipPath>

  <g clip-path="url(#innerClip2)">

    <!-- Chalkboard -->
    <g transform="translate(30,90) rotate(-3)">
      <rect x="0" y="0" width="190" height="230" rx="6" fill="#B08D57"/>
      <rect x="10" y="10" width="170" height="210" rx="4" fill="#2E5B44"/>
      <text x="30" y="60" font-family="'Comic Sans MS', cursive, sans-serif" font-size="26" fill="#EAF3E5" font-weight="700">Guru</text>
      <text x="30" y="98" font-family="'Comic Sans MS', cursive, sans-serif" font-size="26" fill="#EAF3E5" font-weight="700">Melayani</text>
      <text x="30" y="136" font-family="'Comic Sans MS', cursive, sans-serif" font-size="26" fill="#EAF3E5" font-weight="700">Dengan</text>
      <text x="30" y="174" font-family="'Comic Sans MS', cursive, sans-serif" font-size="26" fill="#EAF3E5" font-weight="700">Hati</text>
      <path d="M45 192 Q50 182 55 192 Q60 178 65 192 Q70 182 75 192 Q65 210 55 210 Q45 210 45 192 Z" fill="#EAF3E5" opacity="0.9"/>
    </g>

    <!-- Books stack -->
    <g transform="translate(15,300)">
      <rect x="0" y="55" width="80" height="18" rx="3" fill="#3B7D3F"/>
      <rect x="4" y="35" width="72" height="18" rx="3" fill="#D94B3A"/>
      <rect x="0" y="15" width="80" height="18" rx="3" fill="#2F6FE0"/>
      <rect x="20" y="-40" width="30" height="55" rx="3" fill="#4E5FE0"/>
      <rect x="24" y="-46" width="8" height="10" fill="#2A2320"/>
      <rect x="36" y="-46" width="8" height="10" fill="#3A2E1F"/>
    </g>

    <!-- Desk shadow strip -->
    <rect x="0" y="330" width="500" height="170" fill="#DCE7F7" opacity="0.5"/>

    <!-- Laptop -->
    <g transform="translate(300,330)">
      <path d="M10 90 L190 90 L175 30 Q173 20 160 20 L40 20 Q27 20 25 30 Z" fill="#98A2B8"/>
      <rect x="35" y="28" width="115" height="52" rx="3" fill="#5A6478"/>
      <rect x="-15" y="90" width="220" height="14" rx="6" fill="#7C879C"/>
    </g>

    <!-- Body / seragam -->
    <path d="M110 500 Q104 340 250 322 Q396 340 390 500 Z" fill="url(#seragam)"/>
    <!-- Name badge -->
    <rect x="205" y="378" width="46" height="16" rx="3" fill="#2A2320"/>
    <!-- Button -->
    <circle cx="278" cy="410" r="7" fill="#E8B84B"/>

    <!-- Waving arm -->
    <path d="M175 500 Q140 430 118 360 Q108 340 128 328 Q148 320 158 340 Q178 400 205 460 Z" fill="url(#seragam)"/>
    <!-- Hand -->
    <g transform="translate(90,300)">
      <ellipse cx="30" cy="60" rx="26" ry="30" fill="#F3CBA0"/>
      <rect x="16" y="0" width="9" height="45" rx="4" fill="#F3CBA0"/>
      <rect x="27" y="-8" width="9" height="53" rx="4" fill="#F3CBA0"/>
      <rect x="38" y="-6" width="9" height="51" rx="4" fill="#F3CBA0"/>
      <rect x="49" y="2" width="9" height="43" rx="4" fill="#F3CBA0"/>
    </g>

    <!-- Neck -->
    <rect x="228" y="288" width="44" height="50" rx="14" fill="#F3CBA0"/>

    <!-- Face -->
    <ellipse cx="250" cy="235" rx="82" ry="92" fill="#F3CBA0"/>

    <!-- Hair back (flowing to shoulders) -->
    <path d="M162 245 Q140 380 175 470 Q205 420 210 300 L210 240 Z" fill="url(#rambut4)"/>
    <path d="M338 245 Q360 380 325 470 Q295 420 290 300 L290 240 Z" fill="url(#rambut4)"/>

    <!-- Hair top / bangs -->
    <path d="M162 245
             Q145 125 250 112
             Q355 125 338 245
             Q328 175 292 158
             Q305 190 296 222
             Q265 168 250 165
             Q235 168 204 222
             Q195 190 208 158
             Q172 175 162 245 Z" fill="url(#rambut4)"/>
    <circle cx="250" cy="122" r="12" fill="#241811"/>

    <!-- Glasses -->
    <g stroke="#241C18" stroke-width="4" fill="#ffffff" fill-opacity="0.2">
      <circle cx="213" cy="235" r="26"/>
      <circle cx="287" cy="235" r="26"/>
      <line x1="239" y1="235" x2="261" y2="235"/>
      <line x1="187" y1="228" x2="170" y2="222"/>
      <line x1="313" y1="228" x2="330" y2="222"/>
    </g>

    <!-- Eyebrows -->
    <path d="M195 202 Q213 192 231 200" stroke="#3A2E1F" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M269 200 Q287 192 305 202" stroke="#3A2E1F" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- Cheeks -->
    <ellipse cx="203" cy="262" rx="15" ry="9" fill="#EFA98A" opacity="0.5"/>
    <ellipse cx="297" cy="262" rx="15" ry="9" fill="#EFA98A" opacity="0.5"/>

    <!-- Nose -->
    <path d="M247 240 Q243 258 250 264" stroke="#D9A876" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Smile -->
    <path d="M218 278 Q250 305 282 278" stroke="#B5583F" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M228 282 Q250 296 272 282" fill="#ffffff"/>

    <!-- Small earrings -->
    <circle cx="180" cy="258" r="5" fill="#d4af37"/>
    <circle cx="320" cy="258" r="5" fill="#d4af37"/>

  </g>

  <!-- Speech bubble icon -->
  <g transform="translate(345,175)">
    <ellipse cx="47" cy="52" rx="52" ry="42" fill="#2F6FE0"/>
    <path d="M20 88 L10 108 L38 90 Z" fill="#2F6FE0"/>
    <circle cx="26" cy="52" r="6" fill="#ffffff"/>
    <circle cx="47" cy="52" r="6" fill="#ffffff"/>
    <circle cx="68" cy="52" r="6" fill="#ffffff"/>
    <g stroke="#F2B23C" stroke-width="6" stroke-linecap="round">
      <line x1="108" y1="10" x2="118" y2="-6"/>
      <line x1="118" y1="30" x2="140" y2="26"/>
      <line x1="112" y1="52" x2="132" y2="60"/>
    </g>
  </g>

  <!-- LIVE CHAT badge -->
  <g transform="translate(70,388)">
    <rect x="0" y="0" width="330" height="66" rx="33" fill="#E11D2E" stroke="#ffffff" stroke-width="6"/>
    <path d="M40 62 L18 92 L62 64 Z" fill="#E11D2E" stroke="#ffffff" stroke-width="6"/>
    <circle cx="42" cy="33" r="14" fill="#ffffff"/>
    <text x="80" y="45" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="1">LIVE CHAT</text>
  </g>

</svg>
